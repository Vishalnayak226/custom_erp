name: Monthly documentation health

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04 # pinned label, not the floating `ubuntu-latest` (Stage 49.9.4/49.9.8)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (pinned; Stage 49.9.8)
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0 (pinned)
        with:
          go-version: '1.22.12'
      - name: Collect advisory health findings
        shell: pwsh
        run: |
          go run ./cmd/doclint -json | Set-Content -LiteralPath "$env:RUNNER_TEMP/document-health.json" -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Documentation inventory failed.' }
      - name: Verify generated content without repository writes
        shell: pwsh
        run: ./docs/update-docs.ps1 -Group Content -Check
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (pinned)
        with:
          path: ${{ runner.temp }}/document-link-cache.json
          key: document-links-${{ github.run_id }}
          restore-keys: document-links-
      - name: Check public external links with a bounded cache
        run: go run ./cmd/doclint -external-out "$RUNNER_TEMP/document-links.json" -external-cache "$RUNNER_TEMP/document-link-cache.json"
      - name: Retain report for owner review
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.2 (pinned)
        with:
          name: document-health-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/document-health.json
            ${{ runner.temp }}/document-links.json
          if-no-files-found: error
          retention-days: 90
